# ─── CLIENT : shop.monsite.com (clients uniquement) ───
server {
    listen 80;
    server_name ${DOMAIN_CLIENT};
    root /usr/share/nginx/html;
    index index.html;

    # API REST → backend
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → backend
    location /ws {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Fichiers uploadés → backend
    location /uploads/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
    }

    # ❌ Routes ADMIN bloquées pour les clients → redirigé vers le shop
    location ~ ^/(dashboard|sales|inventory|movements|receipts|transfers
                  |users|settings|finance|reports|suppliers|categories
                  |technicians|repairs|installations|customers
                  |purchase-orders|scan|admin|messages) {
        return 302 /shop;
    }

    # Fichiers statiques (cache désactivé pour les mises à jour)
    location ~* \.(html|js|css|json|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        expires 0;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        expires 0;
    }

    # ✅ Routes publiques : shop, cart, checkout, contact, client, login
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── STAFF : staff.monsite.com (administration + shop) ───
server {
    listen 80;
    server_name ${DOMAIN_STAFF};
    root /usr/share/nginx/html;
    index index.html;

    # API REST → backend
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → backend
    location /ws {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Fichiers uploadés → backend
    location /uploads/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
    }

    # Fichiers statiques
    location ~* \.(html|js|css|json|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        expires 0;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        expires 0;
    }

    # ✅ Toutes les routes autorisées (admin + shop)
    location / {
        try_files $uri $uri/ /index.html;
    }
}