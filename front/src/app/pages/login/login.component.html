<div class="login-page">
  <!-- Brand Side -->
  <div class="login-brand">
    <div class="login-brand-content">
      <div class="login-logo">⚡</div>
      <h1>Electro Canadien</h1>
      <p>L'expertise au service de votre énergie</p>
      <div class="login-brand-features">
        <span class="feature-badge">☀️ Solaire</span>
        <span class="feature-badge">🔧 Électroménager</span>
        <span class="feature-badge">📦 Livraison</span>
      </div>
    </div>
  </div>

  <!-- Form Side -->
  <div class="login-form-side">
    <div class="login-form-container">
      <div class="login-form-header">
        <h2>Bienvenue</h2>
        <p>Connectez-vous à votre espace</p>
      </div>

      <!-- Form -->
      <form (submit)="onSubmit($event)" class="login-form">
        <!-- Staff username -->
        <div class="form-group">
          <label class="form-label" for="username">Nom d'utilisateur</label>
          <input type="text" id="username" class="form-input" [(ngModel)]="username" name="username" placeholder="Identifiant" required />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <input type="password" id="password" class="form-input" [(ngModel)]="password" name="password" placeholder="••••••••" required />
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="loading">
          <span *ngIf="!loading">SE CONNECTER</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>

        <!-- Error -->
        <div class="alert alert-danger" *ngIf="errorMessage">
          <span>⚠️</span>
          <span>{{ errorMessage }}</span>
        </div>
      </form>
    </div>
  </div>
</div>
